# =====================================================================================
# INVITO WHATSAPP - box "scrivici, e' gratis e senza impegno"
# UNICO punto dove si cambiano i testi: la modifica vale su TUTTE le pagine in cui il box compare.
# Come funziona: _includes/invito-whatsapp.html legge questo file; _layouts/single.html lo richiama
# in fondo a ogni pagina. Il bottone WhatsApp usa `whatsapp` di _config.yml (vuoto + whatsapp_demo:true
# = bottone visibile ma con link "#", da attivare mettendo il numero in _config.yml).
#
# attivo      : true/false. false = il box sparisce da tutto il sito.
# posizioni   : il box compare IN ALTO (prima del testo) e in fondo. Per toglierne uno: _layouts/single.html, riga con include invito-whatsapp
# mostra_su   : dove compare. Valori: servizi (pagine dei servizi), posts (articoli del blog).
# messaggio   : testo precompilato in WhatsApp. {titolo} diventa il titolo della pagina.
#
# Perche' e' scritto cosi' (guide di copywriting/UX: HubSpot-style, MarketingSherpa, CopyHackers):
#  1. titolo = il RISULTATO che il visitatore vuole ("scopri cosa conviene fare"), non "Contattaci" (valore prima del brand)
#  2. testo = un solo passo, piccolo ("due righe") + tolgo l'attrito ("niente moduli")
#  3. bottone = verbo + canale concreto ("Scrivici su WhatsApp"), non "Invia"
#  4. nota sotto il bottone = riduce il rischio percepito ("gratuito, senza impegno")
#  5. UNA azione grande (WhatsApp = la piu' veloce) + due vie classiche piccole (email, modulo): piu' scelte uguali = meno clic
#  6. niente promesse non verificabili (tempi di risposta, prezzi): non aggiungerle se non sono vere
# =====================================================================================
attivo: true
mostra_su: [servizi, posts]

it:
  titolo: "Scopri cosa conviene fare nel tuo caso"
  testo: "Scrivici su WhatsApp due righe sulla tua situazione: ti diciamo se possiamo aiutarti e da dove partire. Niente moduli da compilare."
  bottone: "Scrivici su WhatsApp"
  nota: "Primo contatto gratuito e senza impegno."
  alternativa: "Preferisci un altro modo?"
  email: "Scrivi una email"
  modulo: "Compila il modulo"
  oggetto_email: "Richiesta informazioni:"
  messaggio: "Buongiorno, vorrei un primo contatto gratuito e senza impegno su: {titolo}."

en:
  titolo: "Find out what makes sense in your case"
  testo: "Message us on WhatsApp with two lines about your situation: we will tell you if we can help and where to start. No forms to fill in."
  bottone: "Message us on WhatsApp"
  nota: "Free first contact, no obligation."
  alternativa: "Prefer another way?"
  email: "Send an email"
  modulo: "Use the contact form"
  oggetto_email: "Information request:"
  messaggio: "Hello, I would like a free, no-obligation first contact about: {titolo}."
