# Riquadro "chi siamo + contatti" in cima alla barra laterale destra (articoli e servizi).
# foto: immagine del riquadro (vuota = riquadro nascosto). I testi sono per lingua (it / en).
# Il pulsante WhatsApp usa whatsapp di _config.yml (vuoto + whatsapp_demo:true = link "#"); l'email usa email di _config.yml.
# social: nome + url. "#" = link ancora da mettere (cambia solo l'url, la voce compare gia').
foto: /assets/images/studio-team.jpg
it:
  titolo: "Studio Commerciale"
  testo: "Consulenza fiscale, contabile e societaria per imprese e professionisti. Hai un dubbio sul tuo caso? Scrivici due righe: ti diciamo se possiamo aiutarti e da dove partire. Primo contatto gratuito e senza impegno."
  segui: "Contattaci"
  whatsapp: "Scrivici su WhatsApp"
  email: "Email"
  messaggio: "Buongiorno, vorrei un primo contatto gratuito e senza impegno."
